name: Update IPTV

on:
  workflow_dispatch:

concurrency:
  group: update-iptv
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Schedule diagnostics
        run: |
          set -euo pipefail
          echo "Event: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Current UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Current WIB: $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S WIB')"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          python scraper.py
          END_TIME=$(date +%s)
          echo "Scraper completed in $((END_TIME - START_TIME))s"

      - name: Validate matches.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open("matches.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          matches = data.get("matches")
          if not isinstance(matches, list) or not matches:
              raise SystemExit("ERROR: matches.json invalid or empty")
          print(f"Matches: {len(matches)} -> OK")
          PY

      - name: Build playlist
        run: |
          set -euo pipefail
          python playlist.py

      - name: Validate playlist
        run: |
          set -euo pipefail
          grep -q '^#EXTM3U' playlist.m3u
          CHANNEL_COUNT=$(grep -c '^#EXTINF:' playlist.m3u || true)
          echo "Channels: $CHANNEL_COUNT"
          if [ "$CHANNEL_COUNT" -lt 1 ]; then
            echo "ERROR: playlist contains 0 channels"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json playlist.m3u
          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update IPTV playlist"
            git push
            echo "Changes pushed successfully."
          fi
